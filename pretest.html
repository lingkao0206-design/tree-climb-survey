<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上課前測 · 出發前的心情</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

:root {
  --bark: #4A2E0E;
  --bark-mid: #7A5230;
  --bark-light: #A0784A;
  --moss: #2D6A27;
  --moss-light: #4E9E45;
  --leaf: #6DC83E;
  --leaf-dark: #3A7A20;
  --sky-top: #1A6FA8;
  --sky-mid: #4CA8D8;
  --sky-low: #A8D8F0;
  --sun: #FFD84A;
  --cream: #FEF6E0;
  --ground: #4A7C2F;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans TC', sans-serif;
}

/* ========== WORLD ========== */
#world {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: linear-gradient(180deg, #0D4A7A 0%, #1A6FA8 25%, #4CA8D8 55%, #A8D8F0 80%, #C8EAD0 100%);
}

.sky-cloud {
  position: absolute;
  font-size: 48px;
  opacity: 0.85;
  animation: cloudDrift linear infinite;
  pointer-events: none;
  filter: blur(0.5px);
}
@keyframes cloudDrift {
  from { transform: translateX(-120px); }
  to   { transform: translateX(calc(100vw + 120px)); }
}

#sun {
  position: absolute;
  top: 60px; right: 80px;
  width: 70px; height: 70px;
  border-radius: 50%;
  background: radial-gradient(circle, #FFF7A0 30%, #FFD84A 70%, rgba(255,200,50,0) 100%);
  box-shadow: 0 0 60px 30px rgba(255,210,60,0.35);
  animation: sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse {
  0%,100% { box-shadow: 0 0 60px 30px rgba(255,210,60,0.35); }
  50%      { box-shadow: 0 0 80px 40px rgba(255,210,60,0.5); }
}

.bird {
  position: absolute;
  font-size: 20px;
  animation: birdFly linear infinite;
  pointer-events: none;
}
@keyframes birdFly {
  from { transform: translateX(-60px) translateY(0); }
  50%  { transform: translateX(50vw) translateY(-20px); }
  to   { transform: translateX(calc(100vw + 60px)) translateY(5px); }
}

#scroller {
  position: absolute;
  inset: 0;
  transition: transform 1.2s cubic-bezier(0.45, 0, 0.15, 1);
  will-change: transform;
}

#ground-plane {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 200px;
}

.ground-grass {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 140px;
  background: linear-gradient(180deg, #5A9E3A 0%, #3D7225 40%, #2A5018 100%);
  border-radius: 60% 60% 0 0 / 40px 40px 0 0;
}

.grass-blade {
  position: absolute;
  bottom: 100%;
  width: 8px;
  background: linear-gradient(180deg, #7DC84A, #4A8A25);
  border-radius: 4px 4px 0 0;
  transform-origin: bottom center;
  animation: grassWave ease-in-out infinite alternate;
}
@keyframes grassWave {
  from { transform: rotate(-8deg); }
  to   { transform: rotate(8deg); }
}

.trunk-seg { opacity: 0; transition: opacity 0.4s; }
.bark-line { stroke: rgba(0,0,0,0.15); stroke-width: 1.5; fill: none; stroke-linecap: round; }
.tree-knot-svg { fill: #2A1504; opacity: 0.5; }
.branch-svg {
  opacity: 0;
  transform-origin: 0 50%;
  transition: opacity 0.5s, transform 0.5s;
  transform: scaleX(0);
}
.branch-svg.visible { opacity: 1; transform: scaleX(1); }
.leaf-group { opacity: 0; transition: opacity 0.7s; transform-origin: center bottom; }
.leaf-group.visible { opacity: 1; }
.leaf-shape { animation: leafSway ease-in-out infinite alternate; transform-origin: center bottom; }
@keyframes leafSway {
  from { transform: rotate(-4deg) scale(1); }
  to   { transform: rotate(4deg) scale(1.03); }
}

#climber {
  position: absolute;
  left: 50%;
  width: 90px;
  height: 110px;
  margin-left: -45px;
  transition: bottom 1.1s cubic-bezier(0.34, 1.4, 0.64, 1);
  pointer-events: none;
  z-index: 20;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.45));
}

@keyframes stepLegUp { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-20deg); } }
@keyframes stepLegDown { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(18deg); } }
@keyframes graspArm { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(5deg); } }
@keyframes pullArm { 0%,100% { transform: rotate(20deg); } 50% { transform: rotate(-5deg); } }
@keyframes bodyLean { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

#rope {
  position: absolute;
  left: 50%;
  width: 4px;
  margin-left: -2px;
  background: repeating-linear-gradient(180deg, #E8A030 0px, #E8A030 8px, #C07820 8px, #C07820 16px);
  border-radius: 2px;
  bottom: 100px;
  transition: height 1.1s cubic-bezier(0.45, 0, 0.15, 1), bottom 1.1s cubic-bezier(0.45, 0, 0.15, 1);
  z-index: 15;
}

.particle {
  position: fixed;
  pointer-events: none;
  z-index: 200;
  animation: particleFly 1.2s ease-out forwards;
  font-size: 22px;
}
@keyframes particleFly {
  0%   { opacity: 1; transform: translate(0,0) scale(0.6) rotate(0deg); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--dr)); }
}

#ui {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  pointer-events: none;
}

.card {
  pointer-events: all;
  background: rgba(254,246,224,0.97);
  backdrop-filter: blur(12px);
  border-radius: 28px;
  padding: 32px 28px;
  max-width: 460px;
  width: 100%;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.25),
    0 0 0 2px rgba(160,120,74,0.2),
    inset 0 1px 0 rgba(255,255,255,0.9);
  border-top: 5px solid var(--moss);
  max-height: 90vh;
  overflow-y: auto;
  scrollbar-width: thin;
}

.height-badge {
  position: fixed;
  top: 20px; left: 20px;
  background: rgba(0,0,0,0.45);
  color: white;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 99px;
  backdrop-filter: blur(8px);
  z-index: 60;
  transition: opacity 0.5s;
  display: flex; align-items: center; gap: 6px;
}

.mode-badge {
  position: fixed;
  top: 20px; right: 20px;
  background: rgba(45,106,39,0.85);
  color: white;
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 99px;
  backdrop-filter: blur(8px);
  z-index: 60;
}

.prog-wrap {
  background: rgba(74,46,14,0.1);
  border-radius: 99px;
  height: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--moss), var(--leaf));
  border-radius: 99px;
  transition: width 0.7s cubic-bezier(0.34,1.56,0.64,1);
}
.prog-label {
  font-family: 'Nunito', sans-serif;
  font-size: 11px;
  font-weight: 800;
  color: var(--bark-light);
  text-align: right;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

.step-badge {
  display: inline-block;
  background: var(--moss);
  color: white;
  font-family: 'Nunito', sans-serif;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  padding: 3px 10px;
  border-radius: 99px;
  margin-bottom: 10px;
  text-transform: uppercase;
}

.q-emoji { font-size: 40px; display: block; text-align: center; margin-bottom: 8px; animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes popIn { from { transform: scale(0.4) rotate(-10deg); opacity:0; } to { transform: scale(1) rotate(0); opacity:1; } }

.q-text { font-size: 17px; font-weight: 700; color: var(--bark); text-align: center; margin-bottom: 20px; line-height: 1.6; }

/* Scale options: 5-point pictorial scale */
.scale-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; }
.scale-btn {
  border: 2px solid rgba(74,46,14,0.12);
  border-radius: 14px;
  background: white;
  cursor: pointer;
  transition: all 0.18s;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 12px 4px 10px; gap: 6px;
  font-family: 'Noto Sans TC', sans-serif;
}
.scale-btn:hover { border-color: var(--moss-light); background: #EEF8E4; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(46,106,39,0.2); }
.scale-btn.sel   { border-color: var(--moss); background: linear-gradient(135deg,#E4F4DA,#CEEAC0); box-shadow: 0 0 0 3px rgba(46,106,39,0.18); transform: translateY(-2px); }
.scale-btn .se { font-size: 30px; line-height:1; }
.scale-btn .sn { font-size: 10px; font-weight: 800; color: var(--bark-light); }
.scale-btn .sl { font-size: 9.5px; color: var(--bark); text-align: center; line-height: 1.25; }

.nav { display: flex; gap: 8px; margin-top: 22px; }
.btn {
  flex: 1; padding: 13px; border-radius: 13px;
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800;
  cursor: pointer; border: none; transition: all 0.18s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.btn-next { background: linear-gradient(135deg, var(--moss), #1E4D1A); color: white; box-shadow: 0 4px 16px rgba(30,77,26,0.4); }
.btn-next:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(30,77,26,0.5); }
.btn-next:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-back { background: rgba(74,46,14,0.08); color: var(--bark-light); flex: 0 0 auto; padding: 13px 16px; }
.btn-back:hover { background: rgba(74,46,14,0.15); }

.screen { display: none; animation: fadeUp 0.35s ease; }
.screen.on { display: block; }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

.start-hero { text-align: center; }
.start-title { font-family:'Nunito',sans-serif; font-size:22px; font-weight:900; color:var(--bark); margin-bottom:6px; }
.start-sub { font-size:13px; color:var(--bark-light); line-height:1.75; margin-bottom:22px; }
.name-in {
  width:100%; border:2px solid rgba(74,46,14,0.15); border-radius:12px;
  padding:13px 16px; font-family:'Noto Sans TC',sans-serif; font-size:14px;
  outline:none; background:white; color:var(--bark); margin-bottom:14px; transition:border-color 0.2s;
}
.name-in:focus { border-color:var(--moss); }
.hint-name { font-size:11px; color:var(--bark-light); margin:-8px 0 14px; line-height:1.6; }

.end-hero { text-align:center; }
.end-title { font-family:'Nunito',sans-serif; font-size:20px; font-weight:900; color:var(--bark); margin-bottom:12px; }
.encourage {
  background: linear-gradient(135deg,#E4F4DA,#D0ECBE);
  border-radius:14px; padding:16px 18px;
  font-size:13px; color:var(--moss); font-weight:600; line-height:1.8;
  border-left:4px solid var(--moss); margin-bottom:16px; text-align:left;
  white-space: pre-line;
}
.summary { background:white; border-radius:14px; padding:14px 16px; border:2px solid rgba(74,46,14,0.08); margin-bottom:12px; }
.summary h4 { font-size:11px; color:var(--bark-light); font-weight:800; letter-spacing:1px; margin-bottom:8px; text-transform:uppercase; }
.s-cat { font-size:11px; font-weight:800; color:var(--moss); margin:10px 0 4px; }
.s-cat:first-child { margin-top:0; }
.s-row { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; font-size:12px; color:var(--bark); }
.s-avg { font-size:11px; color:var(--bark-light); font-weight:700; margin-top:2px; }
.teacher-tag {
  display:inline-flex; align-items:center; gap:5px;
  background:#FFE066; border-radius:99px; padding:6px 14px;
  font-size:11px; font-weight:700; color:#6B4A00; margin-bottom:12px;
}
hr.dashed { border:none; border-top:2px dashed rgba(74,46,14,0.12); margin:14px 0; }
</style>
</head>
<body>

<div id="world">
  <div id="sun"></div>
  <div id="scroller"></div>
  <div id="rope"></div>
  <div id="climber">
    <svg viewBox="0 0 90 110" width="90" height="110" xmlns="http://www.w3.org/2000/svg">
      <line x1="38" y1="42" x2="18" y2="2" stroke="#D4820A" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="42" x2="22" y2="80" stroke="#D4820A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,3"/>
      <ellipse cx="72" cy="38" rx="7" ry="5" fill="none" stroke="#8B4513" stroke-width="2.5"/>
      <line x1="65" y1="38" x2="50" y2="42" stroke="#C8600A" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="translate(45,55) rotate(-15)" style="transform-box:fill-box;animation:bodyLean 1.2s ease-in-out infinite alternate;">
        <rect x="-9" y="-18" width="18" height="26" rx="5" fill="#2A5ECC"/>
        <line x1="-8" y1="-16" x2="8" y2="-4"  stroke="#F5900A" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="8"  y1="-16" x2="-8" y2="-4"  stroke="#F5900A" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="-10" y="4" width="20" height="5" rx="2.5" fill="#F5900A"/>
        <g transform="translate(9,-12)" style="transform-box:fill-box; transform-origin:0 0; animation:graspArm 0.9s ease-in-out infinite alternate;">
          <rect x="0" y="0" width="8" height="18" rx="4" fill="#2A5ECC"/>
          <ellipse cx="4" cy="19" rx="5" ry="4" fill="#1A1A1A"/>
        </g>
        <g transform="translate(-9,-10)" style="transform-box:fill-box; transform-origin:8px 0; animation:pullArm 0.9s ease-in-out infinite alternate;">
          <rect x="-8" y="0" width="8" height="16" rx="4" fill="#2A5ECC"/>
          <ellipse cx="-4" cy="17" rx="5" ry="4" fill="#1A1A1A"/>
        </g>
        <path d="M-9,8 Q-14,18 -10,24 Q-5,28 0,26 Q5,28 10,24 Q14,18 9,8 Z" fill="#1A3A9A" stroke="#F5900A" stroke-width="1.5"/>
        <g transform="translate(6,24)" style="transform-box:fill-box; transform-origin:0 0; animation:stepLegUp 0.9s ease-in-out infinite alternate;">
          <rect x="-5" y="0" width="10" height="22" rx="5" fill="#1A3080"/>
          <rect x="-6" y="20" width="16" height="8" rx="3" fill="#2A1504"/>
          <rect x="8" y="22" width="6" height="4" rx="2" fill="#555"/>
        </g>
        <g transform="translate(-6,24)" style="transform-box:fill-box; transform-origin:0 0; animation:stepLegDown 0.9s ease-in-out infinite alternate;">
          <rect x="-5" y="0" width="10" height="18" rx="5" fill="#1A3080"/>
          <rect x="-6" y="16" width="16" height="8" rx="3" fill="#2A1504"/>
          <rect x="8" y="18" width="6" height="4" rx="2" fill="#555"/>
        </g>
        <ellipse cx="0" cy="-26" rx="11" ry="12" fill="#F0C090"/>
        <path d="M-11,-28 Q-11,-42 0,-44 Q11,-42 11,-28 Z" fill="#DD2222"/>
        <rect x="-13" y="-29" width="26" height="5" rx="2.5" fill="#BB1111"/>
        <rect x="-2" y="-28" width="15" height="3" rx="1.5" fill="#991111"/>
        <ellipse cx="6" cy="-24" rx="2.5" ry="2" fill="#2A1504"/>
        <path d="M2,-19 Q6,-16 10,-19" stroke="#AA7040" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <line x1="80" y1="0" x2="80" y2="110" stroke="#5C3D1E" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    </svg>
  </div>
</div>

<div class="height-badge" id="heightBadge">🌳 地面</div>
<div class="mode-badge">📝 課程前測</div>

<div id="ui">
  <div class="card">

    <div class="screen on" id="s-start">
      <div class="start-hero">
        <span style="font-size:68px;display:block;margin-bottom:10px;">🌳</span>
        <div class="start-title">出發前，先聊聊你的心情</div>
        <p class="start-sub">
          等一下就要開始上課囉！🧗<br>
          在上課之前，先告訴老師你現在的感覺<br>
          <strong>沒有對錯，誠實回答就是最棒的答案！</strong>
        </p>
        <input class="name-in" id="nameIn" placeholder="✏️ 你叫什麼名字？（代號也可以）" maxlength="20">
        <div class="hint-name">請填寫和課後測相同的姓名／代號，老師才能配對你的前後測結果喔！</div>
        <button class="btn btn-next" style="width:100%" onclick="startQuiz()">準備出發！ 🐒</button>
      </div>
    </div>

    <div class="screen" id="s-quiz">
      <div class="prog-label" id="progLbl"></div>
      <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
      <div class="step-badge" id="stepBadge"></div>
      <div class="q-text" id="qText"></div>
      <div id="optsArea"></div>
      <div class="nav">
        <button class="btn btn-back" id="backBtn" onclick="goBack()">← 回去</button>
        <button class="btn btn-next" id="nextBtn" onclick="goNext()">下一題 →</button>
      </div>
    </div>

    <div class="screen" id="s-end">
      <div class="end-hero">
        <span id="endEmoji" style="font-size:60px;display:block;margin-bottom:8px;">🌱</span>
        <div class="end-title" id="endTitle"></div>
        <div id="submitStatus" style="font-size:13px;font-weight:700;margin-bottom:10px;color:#A0784A;">📡 傳送中…</div>
        <div class="teacher-tag">📋 教師專用紀錄・課程前測</div>
        <div class="encourage" id="encourage"></div>
        <div class="summary" id="summaryBox"></div>
        <hr class="dashed">
        <p style="font-size:11px;color:var(--bark-light);line-height:1.7;text-align:center;">
          準備好了，我們開始上課吧！🌳
        </p>
      </div>
    </div>

  </div>
</div>

<script>
// ========== SURVEY TYPE ==========
const SURVEY_TYPE = 'pre';
const SURVEY_LABEL = '課程前測';

// ========== QUESTIONS (12 items, 3 subscales x 4) ==========
const QS = [
  { id:'e1', cat:'情緒調節', text:'我現在的心情很好' },
  { id:'e2', cat:'情緒調節', text:'我覺得自己準備好面對等一下的課程了' },
  { id:'e3', cat:'情緒調節', text:'我覺得自己很放鬆、不緊張' },
  { id:'e4', cat:'情緒調節', text:'我覺得等一下就算遇到不順利的事，我也能調整好自己的心情' },
  { id:'b1', cat:'行為調節', text:'我覺得自己等一下能好好聽從老師的指令' },
  { id:'b2', cat:'行為調節', text:'我覺得等一下遇到困難時，我能冷靜面對' },
  { id:'b3', cat:'行為調節', text:'我覺得自己等一下能耐心等待輪到我' },
  { id:'b4', cat:'行為調節', text:'我覺得自己等一下能專心完成任務，不容易分心' },
  { id:'s1', cat:'社會技巧', text:'我很期待等一下和同學一起完成任務' },
  { id:'s2', cat:'社會技巧', text:'我覺得等一下同學需要幫忙時，我會願意幫他' },
  { id:'s3', cat:'社會技巧', text:'我覺得等一下和同學意見不同時，我能好好說出我的想法' },
  { id:'s4', cat:'社會技巧', text:'我覺得等一下能配合同學或團隊的安排' },
];

const SCALE = [
  { e:'😫', l:'非常不同意' },
  { e:'😟', l:'不同意' },
  { e:'😐', l:'普通' },
  { e:'🙂', l:'同意' },
  { e:'😄', l:'非常同意' },
];

const HEIGHTS = ['地面','1公尺','2公尺','3公尺','4公尺','5公尺','6公尺','7公尺','8公尺','9公尺','10公尺','11公尺','快到頂了！'];

let cur = 0, answers = {}, name = '';

// ========== WORLD INIT ==========
const TOTAL_H = window.innerHeight * 5;

function buildWorld() {
  const sc = document.getElementById('scroller');
  sc.style.height = TOTAL_H + 'px';

  const gp = document.createElement('div');
  gp.id = 'ground-plane';
  gp.style.cssText = `position:absolute;bottom:0;left:0;right:0;height:220px;`;
  const grass = document.createElement('div');
  grass.className = 'ground-grass';
  gp.appendChild(grass);
  for (let i = 0; i < 30; i++) {
    const b = document.createElement('div');
    b.className = 'grass-blade';
    b.style.cssText = `left:${Math.random()*100}%;height:${18+Math.random()*24}px;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*2}s;`;
    grass.appendChild(b);
  }
  sc.appendChild(gp);

  buildTreeSVG(sc);

  const cloudEmojis = ['☁️','🌤️','⛅'];
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('div');
    c.className = 'sky-cloud';
    c.textContent = cloudEmojis[Math.floor(Math.random()*cloudEmojis.length)];
    const topY = Math.random() * TOTAL_H * 0.8;
    c.style.cssText = `top:${topY}px;animation-duration:${25+Math.random()*30}s;animation-delay:-${Math.random()*30}s;font-size:${36+Math.random()*40}px;opacity:${0.6+Math.random()*0.35};`;
    sc.appendChild(c);
  }

  for (let i = 0; i < 4; i++) {
    const b = document.createElement('div');
    b.className = 'bird';
    b.textContent = '🐦';
    const topY = (i * 0.2 + 0.05) * TOTAL_H;
    b.style.cssText = `top:${topY}px;animation-duration:${18+i*7}s;animation-delay:-${i*5}s;font-size:${16+Math.random()*10}px;`;
    sc.appendChild(b);
  }
}

function buildTreeSVG(sc) {
  const svgW = 200, svgH = TOTAL_H - 150;
  const cx = svgW / 2;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', svgW);
  svg.setAttribute('height', svgH);
  svg.style.cssText = `position:absolute;bottom:130px;left:50%;transform:translateX(-50%);overflow:visible;`;

  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <linearGradient id="barkG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A2008"/>
      <stop offset="30%" stop-color="#7A5230"/>
      <stop offset="60%" stop-color="#9A6A40"/>
      <stop offset="100%" stop-color="#4A2E0E"/>
    </linearGradient>
    <linearGradient id="barkG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A1504"/>
      <stop offset="50%" stop-color="#6A4220"/>
      <stop offset="100%" stop-color="#3A2008"/>
    </linearGradient>
  `;
  svg.appendChild(defs);

  const segments = 8;
  const segH = svgH / segments;

  for (let i = 0; i < segments; i++) {
    const y1 = svgH - i * segH;
    const y2 = svgH - (i+1) * segH;
    const w1 = 50 - i * 3.5;
    const w2 = 50 - (i+1) * 3.5;

    const seg = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    const pts = `${cx-w1/2},${y1} ${cx+w1/2},${y1} ${cx+w2/2},${y2} ${cx-w2/2},${y2}`;
    seg.setAttribute('points', pts);
    seg.setAttribute('fill', `url(#barkG${i%2===0?'':'2'})`);
    seg.setAttribute('class', 'trunk-seg');
    seg.setAttribute('data-seg', i);
    svg.appendChild(seg);

    for (let t = 0; t < 4; t++) {
      const ty = y1 - segH * (t/4 + 0.1);
      const bline = document.createElementNS('http://www.w3.org/2000/svg','path');
      const curveAmt = (Math.random()-0.5)*10;
      bline.setAttribute('d', `M${cx-w1/2+4},${ty} Q${cx+curveAmt},${ty+4} ${cx+w1/2-4},${ty}`);
      bline.setAttribute('class','bark-line');
      bline.setAttribute('data-seg', i);
      svg.appendChild(bline);
    }

    if (i > 0 && i < segments-1 && Math.random() > 0.4) {
      const ky = y1 - segH * 0.5;
      const kx = cx + (Math.random()-0.5) * (w1 * 0.5);
      const knot = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
      knot.setAttribute('cx', kx); knot.setAttribute('cy', ky);
      knot.setAttribute('rx','7'); knot.setAttribute('ry','5');
      knot.setAttribute('class','tree-knot-svg');
      knot.setAttribute('data-seg', i);
      svg.appendChild(knot);
    }

    if (i > 0 && i < segments-1 && i % 2 === 0) {
      const by = y1 - segH * 0.3;
      const bw = 55 + Math.random()*20;
      const bl = document.createElementNS('http://www.w3.org/2000/svg','path');
      bl.setAttribute('d',`M${cx-w1/2},${by} Q${cx-w1/2-bw*0.6},${by-8} ${cx-w1/2-bw},${by-4}`);
      bl.setAttribute('stroke','#5C3D1E'); bl.setAttribute('stroke-width','10');
      bl.setAttribute('fill','none'); bl.setAttribute('stroke-linecap','round');
      bl.setAttribute('class','branch-svg'); bl.setAttribute('data-seg',i);
      svg.appendChild(bl);
      const br2 = document.createElementNS('http://www.w3.org/2000/svg','path');
      br2.setAttribute('d',`M${cx+w1/2},${by} Q${cx+w1/2+bw*0.6},${by-8} ${cx+w1/2+bw},${by-4}`);
      br2.setAttribute('stroke','#5C3D1E'); br2.setAttribute('stroke-width','10');
      br2.setAttribute('fill','none'); br2.setAttribute('stroke-linecap','round');
      br2.setAttribute('class','branch-svg'); br2.setAttribute('data-seg',i);
      svg.appendChild(br2);

      [-1,1].forEach(side => {
        const lx = cx + side*(w1/2 + bw*0.7);
        const ly = by - 6;
        const lg = document.createElementNS('http://www.w3.org/2000/svg','g');
        lg.setAttribute('class','leaf-group'); lg.setAttribute('data-seg',i);
        for (let lc = 0; lc < 6; lc++) {
          const lf = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
          const lx2 = lx + (Math.random()-0.5)*50;
          const ly2 = ly + (Math.random()-0.5)*35;
          lf.setAttribute('cx',lx2); lf.setAttribute('cy',ly2);
          lf.setAttribute('rx', 18+Math.random()*14); lf.setAttribute('ry', 14+Math.random()*10);
          const green = Math.floor(100+Math.random()*80);
          lf.setAttribute('fill',`rgb(40,${green},30)`);
          lf.setAttribute('class','leaf-shape');
          lf.style.animationDelay = (Math.random()*2)+'s';
          lf.style.animationDuration = (2+Math.random()*2)+'s';
          lg.appendChild(lf);
        }
        svg.appendChild(lg);
      });
    }
  }

  const canopy = document.createElementNS('http://www.w3.org/2000/svg','g');
  canopy.setAttribute('class','leaf-group'); canopy.setAttribute('data-seg', segments-1);
  const cy2 = segH * 1.8;
  const canopyCircles = [
    {x:0,y:0,rx:70,ry:55},{x:-50,y:20,rx:55,ry:45},{x:50,y:20,rx:55,ry:45},
    {x:-30,y:-20,rx:50,ry:40},{x:30,y:-20,rx:50,ry:40},{x:0,y:-30,rx:45,ry:35}
  ];
  const greens = ['#4A9E2A','#3A8020','#5AB830','#2D7018','#68C840','#3A9020'];
  canopyCircles.forEach((c,i) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    el.setAttribute('cx', cx+c.x); el.setAttribute('cy', cy2+c.y);
    el.setAttribute('rx', c.rx); el.setAttribute('ry', c.ry);
    el.setAttribute('fill', greens[i]);
    el.setAttribute('class','leaf-shape');
    el.style.animationDelay = (i*0.3)+'s';
    canopy.appendChild(el);
  });
  svg.appendChild(canopy);

  for (let r = -1; r <= 1; r++) {
    const rootPath = document.createElementNS('http://www.w3.org/2000/svg','path');
    const rx = cx + r*18;
    rootPath.setAttribute('d', `M${rx},${svgH} Q${rx+r*40},${svgH+30} ${rx+r*70},${svgH+20}`);
    rootPath.setAttribute('class','root');
    rootPath.setAttribute('stroke', '#3A2008');
    rootPath.setAttribute('stroke-width', '6');
    rootPath.setAttribute('fill', 'none');
    rootPath.setAttribute('stroke-linecap', 'round');
    svg.appendChild(rootPath);
  }

  sc.appendChild(svg);
}

// ========== SCROLLING / CLIMBING ==========
let worldOffset = 0;
const stepSize = (TOTAL_H - window.innerHeight) / (QS.length + 1);

function scrollToStep(step) {
  worldOffset = step * stepSize;
  document.getElementById('scroller').style.transform = `translateY(${worldOffset}px)`;

  const climber = document.getElementById('climber');
  const rope = document.getElementById('rope');
  const targetBottom = window.innerHeight * 0.35;
  climber.style.bottom = targetBottom + 'px';
  rope.style.bottom = (targetBottom + 68) + 'px';
  rope.style.height = (window.innerHeight * 0.55) + 'px';

  const revealUpTo = Math.floor(step / QS.length * 8);
  document.querySelectorAll('.trunk-seg').forEach(el => {
    const s = parseInt(el.dataset.seg);
    el.style.opacity = s <= revealUpTo ? 1 : 0;
  });
  document.querySelectorAll('.bark-line, .tree-knot-svg').forEach(el => {
    const s = parseInt(el.dataset.seg);
    el.style.opacity = s <= revealUpTo ? 1 : 0;
  });
  document.querySelectorAll('.branch-svg').forEach(el => {
    const s = parseInt(el.dataset.seg);
    if (s <= revealUpTo) el.classList.add('visible');
  });
  document.querySelectorAll('.leaf-group').forEach(el => {
    const s = parseInt(el.dataset.seg);
    if (s <= revealUpTo) el.classList.add('visible');
  });

  const hi = Math.min(step, HEIGHTS.length-1);
  document.getElementById('heightBadge').textContent = '🌳 ' + HEIGHTS[hi];

  climber.style.animation = 'none';
  void climber.offsetWidth;
  climber.style.animation = '';
}

// ========== QUIZ LOGIC ==========
function startQuiz() {
  name = document.getElementById('nameIn').value.trim();
  if (!name) { document.getElementById('nameIn').focus(); return; }
  show('s-quiz');
  cur = 0;
  renderQ();
  scrollToStep(0);
}

function renderQ() {
  const q = QS[cur];
  document.getElementById('progLbl').textContent = `第 ${cur+1} 題，共 ${QS.length} 題`;
  document.getElementById('progFill').style.width = (cur/QS.length*100) + '%';
  document.getElementById('stepBadge').textContent = q.cat;
  document.getElementById('qText').textContent = q.text;

  const area = document.getElementById('optsArea');
  area.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'scale-grid';
  SCALE.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'scale-btn';
    if (answers[q.id] === i+1) btn.classList.add('sel');
    btn.innerHTML = `<span class="se">${o.e}</span><span class="sn">${i+1}</span><span class="sl">${o.l}</span>`;
    btn.onclick = () => {
      answers[q.id] = i+1;
      grid.querySelectorAll('.scale-btn').forEach((b,j) => b.classList.toggle('sel', j===i));
      celebrate(btn);
      updateNext();
    };
    grid.appendChild(btn);
  });
  area.appendChild(grid);

  document.getElementById('backBtn').style.display = cur===0 ? 'none':'flex';
  updateNext();
}

function updateNext() {
  const q = QS[cur];
  const btn = document.getElementById('nextBtn');
  const last = cur === QS.length-1;
  btn.textContent = last ? '完成！🎉' : '下一題 →';
  btn.disabled = answers[q.id] === undefined;
}

function goNext() {
  if (cur < QS.length-1) {
    cur++;
    scrollToStep(cur);
    renderQ();
  } else {
    finish();
  }
}
function goBack() {
  if (cur > 0) { cur--; renderQ(); }
}

function celebrate(btn) {
  const rect = btn.getBoundingClientRect();
  const cx2 = rect.left + rect.width/2;
  const cy2 = rect.top + rect.height/2;
  const items = ['⭐','🍃','✨','🌿'];
  for (let i = 0; i < 5; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = items[Math.floor(Math.random()*items.length)];
    const angle = Math.random()*360;
    const dist = 50+Math.random()*60;
    p.style.setProperty('--dx', Math.cos(angle*Math.PI/180)*dist+'px');
    p.style.setProperty('--dy', Math.sin(angle*Math.PI/180)*dist+'px');
    p.style.setProperty('--dr', (Math.random()-0.5)*360+'deg');
    p.style.left = cx2+'px'; p.style.top = cy2+'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1300);
  }
}

// ========== SCORING ==========
function catAvg(prefix) {
  const ids = QS.filter(q => q.id.startsWith(prefix)).map(q => q.id);
  const vals = ids.map(id => answers[id]).filter(v => v !== undefined);
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}
function overallAvg() {
  const vals = QS.map(q => answers[q.id]).filter(v => v !== undefined);
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

// ========== SUBMIT TO GOOGLE SHEET ==========
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-Gv1TrZ5-LWbGXtwk_jLjIEBU4ZZ0Swx8Q5huQCcONwbq7GXrMqzt8m7nUGgTq1PrLQ/exec';

function submitToSheet() {
  const payload = {
    surveyType: SURVEY_TYPE,
    name: name,
    e1: answers.e1, e2: answers.e2, e3: answers.e3, e4: answers.e4,
    b1: answers.b1, b2: answers.b2, b3: answers.b3, b4: answers.b4,
    s1: answers.s1, s2: answers.s2, s3: answers.s3, s4: answers.s4,
    emotion_avg: catAvg('e'),
    behavior_avg: catAvg('b'),
    social_avg: catAvg('s'),
    overall_avg: overallAvg(),
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(payload)
  }).then(() => {
    const badge = document.getElementById('submitStatus');
    if (badge) { badge.textContent = '✅ 已傳送給老師！'; badge.style.color = '#2D6A27'; }
  }).catch(() => {
    const badge = document.getElementById('submitStatus');
    if (badge) { badge.textContent = '⚠️ 傳送失敗，請告知老師'; badge.style.color = '#AA3030'; }
  });
}

// ========== FINISH ==========
function finish() {
  scrollToStep(QS.length);
  show('s-end');
  submitToSheet();

  const avg = overallAvg();
  let emoji='🌱', title=`${name}，謝謝你的分享！`, enc='';

  if (avg >= 4) {
    enc=`看起來你現在準備得很好、心情也不錯 😊\n帶著這份自信上課吧！如果等一下遇到困難，也可以想起現在這份好狀態，慢慢來就好 🌳`;
  } else if (avg >= 3) {
    enc=`你現在的狀態普普通通，這是很自然的 🙂\n上課前會有點緊張或不確定是正常的，老師會在旁邊陪你，一步一步來就好 🍃`;
  } else {
    enc=`謝謝你誠實地告訴老師現在的感覺 💚\n如果現在有點緊張或不太舒服，沒關係，等一下老師會陪著你，慢慢來，不用勉強自己 🌿`;
  }

  document.getElementById('endEmoji').textContent = emoji;
  document.getElementById('endTitle').textContent = title;
  document.getElementById('encourage').textContent = enc;

  const cats = [
    {label:'情緒調節', prefix:'e'},
    {label:'行為調節', prefix:'b'},
    {label:'社會技巧', prefix:'s'},
  ];
  let html = '<h4>📋 教師紀錄摘要（課程前測）</h4>';
  cats.forEach(c => {
    html += `<div class="s-cat">${c.label}</div>`;
    QS.filter(q => q.id.startsWith(c.prefix)).forEach(q => {
      const v = answers[q.id];
      html += `<div class="s-row"><span>${q.text}</span><span>${v!==undefined ? SCALE[v-1].e+' '+v : '—'}</span></div>`;
    });
    const a = catAvg(c.prefix);
    html += `<div class="s-avg">平均：${a!==null ? a.toFixed(2) : '—'}</div>`;
  });
  html += `<hr class="dashed"><div class="s-avg">總平均：${avg!==null ? avg.toFixed(2) : '—'}</div>`;
  document.getElementById('summaryBox').innerHTML = html;

  setTimeout(() => {
    for(let i=0;i<12;i++){
      setTimeout(()=>{
        const p=document.createElement('div');
        p.className='particle';
        p.textContent=['🌟','🍃','✨'][Math.floor(Math.random()*3)];
        p.style.setProperty('--dx',(Math.random()-0.5)*200+'px');
        p.style.setProperty('--dy',-(80+Math.random()*200)+'px');
        p.style.setProperty('--dr',(Math.random()-0.5)*720+'deg');
        p.style.left=(20+Math.random()*60)+'vw'; p.style.top='70vh';
        p.style.fontSize=(20+Math.random()*20)+'px';
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),1400);
      },i*80);
    }
  },300);
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

buildWorld();

climber0.style.bottom = '150px';
rope0.style.bottom = '218px';
rope0.style.height = '0px';
</script>
